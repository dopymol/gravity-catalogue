{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><title>Gravity Price List</title><link rel="manifest" href="{% url 'manifest' %}"><link rel="icon" href="{% static 'icons/icon.svg' %}"><link rel="apple-touch-icon" href="{% static 'icons/icon.svg' %}"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/htmx.org@2.0.4"></script><link rel="stylesheet" href="{% static 'css/app.css' %}"><script defer src="{% static 'js/app.js' %}"></script></head><body class="bg-white text-slate-800"><main class="mx-auto min-h-screen w-full max-w-xl px-3 pb-24 pt-4 sm:px-5"><header class="mb-3 flex items-center gap-3"><img src="{% static 'icons/icon.svg' %}" class="h-12 w-20" alt="Gravity"><div><h1 class="text-xl font-bold leading-tight">Gravity</h1><p class="text-xs text-slate-500">Price list · {{ last_updated|date:'d M h:i a' }}</p></div></header><form id="searchForm" class="relative mb-2" hx-get="{% url 'product_results' %}" hx-target="#catalogueContent" hx-trigger="input changed delay:300ms, search" hx-push-url="true"><span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-2xl text-slate-400">⌕</span><input name="q" value="{{ query }}" class="h-14 w-full rounded-xl border border-slate-200 bg-white pl-12 pr-4 text-base outline-none focus:border-slate-400" placeholder="Search model or brand" autocomplete="off"><input id="brandInput" type="hidden" name="brand" value="{{ selected_brand }}"></form><div id="catalogueContent">{% include 'catalogue/partials/catalogue_content.html' %}</div></main><div id="productModal"></div><a id="excelLink" href="{% url 'export_excel' %}{% if selected_brand %}?brand={{ selected_brand }}{% endif %}" class="fixed bottom-8 left-1/2 z-20 flex h-12 w-[calc(100%-24px)] max-w-xl -translate-x-1/2 items-center justify-center rounded-xl border border-slate-200 bg-white/95 font-medium shadow-sm backdrop-blur">▣ &nbsp; Full price list (Excel)</a><footer class="fixed bottom-1 left-0 right-0 text-center text-[10px] text-slate-400">Gravity catalogue</footer></body></html>
